<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2042"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- Gold Outer Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Bus Body Graphic -->
  <path d="M16 28 C16 23 20 20 26 20 L42 20 C46 20 48 23 48 28 L48 42 C48 44 46.5 45 45 45 L45 48 C45 49.5 43 49.5 43 48 L43 45 L21 45 L21 48 C21 49.5 19 49.5 19 48 L19 45 C17.5 45 16 44 16 42 Z" fill="#FFFFFF"/>
