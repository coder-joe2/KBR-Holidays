  <!-- Bus Windows/Grille -->
  <rect x="20" y="35" width="24" height="2.5" rx="1.25" fill="#0F2042"/>
  <!-- Headlights -->
  <circle cx="21" cy="41" r="2" fill="#FBBF24"/>
  <circle cx="43" cy="41" r="2" fill="#FBBF24"/>
  <!-- Gold Accent Line -->
  <path d="M14 47 Q32 55 50 47" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Text KBR -->
  <text x="32" y="16" fill="url(#gold)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" text-anchor="middle" letter-spacing="1">KBR</text>
</svg>
