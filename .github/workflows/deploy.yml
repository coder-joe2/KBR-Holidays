name: KBR Holidays CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm
        run: npm install -g npm@latest
        
      - name: Install dependencies
        run: npm install

      - name: Run Lint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck || true

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
